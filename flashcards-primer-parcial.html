<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards - Primer Parcial Sistemas Operativos</title>
<style>
:root {
  --bg: #0f172a;
  --card-bg: #1e293b;
  --card-front: #334155;
  --accent: #38bdf8;
  --accent2: #818cf8;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --success: #4ade80;
  --danger: #f87171;
  --warning: #fbbf24;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
}
.header {
  text-align: center;
  margin-bottom: 24px;
}
.header h1 {
  font-size: 1.4rem;
  color: var(--accent);
  margin-bottom: 4px;
}
.header p {
  font-size: 0.85rem;
  color: var(--text-muted);
}
.progress-bar {
  width: 100%;
  max-width: 600px;
  margin: 12px auto;
  height: 6px;
  background: var(--card-bg);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 3px;
  transition: width 0.3s;
}
.stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 12px 0;
  font-size: 0.85rem;
}
.stat { display: flex; align-items: center; gap: 4px; }
.stat .dot {
  width: 8px; height: 8px; border-radius: 50%;
}
.dot-correct { background: var(--success); }
.dot-incorrect { background: var(--danger); }
.dot-remaining { background: var(--text-muted); }
.controls-top {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.btn {
  padding: 6px 14px;
  border: 1px solid var(--text-muted);
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.card-container {
  max-width: 600px;
  margin: 0 auto;
  perspective: 1000px;
}
.card {
  position: relative;
  width: 100%;
  min-height: 280px;
  cursor: pointer;
  transition: transform 0.5s;
  transform-style: preserve-3d;
}
.card.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  min-height: 280px;
  backface-visibility: hidden;
  border-radius: 16px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.card-front {
  background: linear-gradient(135deg, var(--card-front), var(--card-bg));
  border: 1px solid #475569;
}
.card-back {
  background: linear-gradient(135deg, #1a3a2a, #1e293b);
  border: 1px solid #2d5a3d;
  transform: rotateY(180deg);
  overflow-y: auto;
  justify-content: flex-start;
  text-align: left;
}
.card-number {
  font-size: 0.75rem;
  color: var(--accent);
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.card-topic {
  font-size: 0.7rem;
  color: var(--accent2);
  margin-bottom: 12px;
  padding: 2px 10px;
  border: 1px solid var(--accent2);
  border-radius: 12px;
}
.card-question {
  font-size: 1.1rem;
  line-height: 1.5;
  font-weight: 500;
}
.card-hint {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 16px;
}
.card-back .card-number { color: var(--success); }
.card-answer {
  font-size: 0.95rem;
  line-height: 1.6;
  width: 100%;
}
.card-answer strong { color: var(--accent); }
.card-answer ul {
  padding-left: 18px;
  margin: 6px 0;
}
.card-answer li { margin: 3px 0; }
.nav-buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
}
.nav-btn {
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s;
}
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-prev { background: var(--card-bg); color: var(--text); }
.btn-prev:hover:not(:disabled) { background: #334155; }
.btn-correct { background: #166534; color: white; }
.btn-correct:hover:not(:disabled) { background: #15803d; }
.btn-incorrect { background: #991b1b; color: white; }
.btn-incorrect:hover:not(:disabled) { background: #b91c1c; }
.btn-next { background: var(--card-bg); color: var(--text); }
.btn-next:hover:not(:disabled) { background: #334155; }
.counter {
  font-size: 0.85rem;
  color: var(--text-muted);
  min-width: 60px;
  text-align: center;
}
.filter-section {
  max-width: 600px;
  margin: 0 auto 16px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
.filter-btn {
  padding: 4px 10px;
  border: 1px solid #475569;
  border-radius: 12px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.75rem;
  transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: var(--accent2); color: white; border-color: var(--accent2); }
.summary {
  max-width: 600px;
  margin: 20px auto;
  padding: 24px;
  background: var(--card-bg);
  border-radius: 16px;
  text-align: center;
  display: none;
}
.summary h2 { color: var(--accent); margin-bottom: 12px; }
.summary .score { font-size: 2.5rem; font-weight: bold; margin: 12px 0; }
.summary .score.good { color: var(--success); }
.summary .score.ok { color: var(--warning); }
.summary .score.bad { color: var(--danger); }
.keyboard-hint {
  text-align: center;
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 12px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}
</style>
</head>
<body>

<div class="header">
  <h1>Sistemas Operativos - Primer Parcial</h1>
  <p>Ing. Angel Isidro Mercado | FI UNAM | Grupo 01</p>
</div>

<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

<div class="stats">
  <div class="stat"><div class="dot dot-correct"></div><span id="correctCount">0</span> correctas</div>
  <div class="stat"><div class="dot dot-incorrect"></div><span id="incorrectCount">0</span> incorrectas</div>
  <div class="stat"><div class="dot dot-remaining"></div><span id="remainingCount">32</span> restantes</div>
</div>

<div class="filter-section">
  <button class="filter-btn active" onclick="setFilter('all')">Todas</button>
  <button class="filter-btn" onclick="setFilter('tema1')">Tema 1</button>
  <button class="filter-btn" onclick="setFilter('tema2')">Tema 2</button>
  <button class="filter-btn" onclick="setFilter('extra')">Extra</button>
</div>

<div class="controls-top">
  <button class="btn" onclick="shuffleCards()">Mezclar</button>
  <button class="btn" onclick="resetAll()">Reiniciar</button>
  <button class="btn" id="onlyWrongBtn" onclick="showOnlyWrong()">Solo incorrectas</button>
</div>

<div class="card-container" id="cardContainer">
  <div class="card" id="card" onclick="flipCard()">
    <div class="card-face card-front">
      <div class="card-number" id="cardNum"></div>
      <div class="card-topic" id="cardTopic"></div>
      <div class="card-question" id="cardQuestion"></div>
      <div class="card-hint">Toca para ver la respuesta</div>
    </div>
    <div class="card-face card-back">
      <div class="card-number" id="cardNumBack">RESPUESTA</div>
      <div class="card-answer" id="cardAnswer"></div>
    </div>
  </div>
</div>

<div class="nav-buttons">
  <button class="nav-btn btn-prev" id="prevBtn" onclick="prevCard()">&#9664;</button>
  <button class="nav-btn btn-incorrect" onclick="markIncorrect()">&#10007;</button>
  <div class="counter" id="counter"></div>
  <button class="nav-btn btn-correct" onclick="markCorrect()">&#10003;</button>
  <button class="nav-btn btn-next" id="nextBtn" onclick="nextCard()">&#9654;</button>
</div>

<div class="keyboard-hint">
  Teclado: Espacio = voltear | &#8592;&#8594; = navegar | C = correcta | X = incorrecta
</div>

<div class="summary" id="summary">
  <h2>Resultado Final</h2>
  <div class="score" id="finalScore"></div>
  <p id="finalMsg"></p>
  <br>
  <button class="btn" onclick="resetAll()">Intentar de nuevo</button>
  <button class="btn" style="margin-left:8px" onclick="showOnlyWrong()">Repasar incorrectas</button>
</div>

let cards = [...allCards];
let currentIndex = 0;
let isFlipped = false;
let correct = new Set();
let incorrect = new Set();
let currentFilter = 'all';

function updateCard() {
  if (cards.length === 0) {
    showSummary();
    return;
  }
  const c = cards[currentIndex];
  document.getElementById('cardNum').textContent = `PREGUNTA ${c.id} / 32`;
  document.getElementById('cardNumBack').textContent = `RESPUESTA ${c.id}`;
  document.getElementById('cardTopic').textContent = c.topic;
  document.getElementById('cardQuestion').textContent = c.q;
  document.getElementById('cardAnswer').innerHTML = c.a;
  document.getElementById('counter').textContent = `${currentIndex + 1} / ${cards.length}`;
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex >= cards.length - 1;
  document.getElementById('progress').style.width =
    `${((correct.size + incorrect.size) / allCards.length) * 100}%`;
  document.getElementById('correctCount').textContent = correct.size;
  document.getElementById('incorrectCount').textContent = incorrect.size;
  document.getElementById('remainingCount').textContent =
    allCards.length - correct.size - incorrect.size;

  if (isFlipped) {
    document.getElementById('card').classList.remove('flipped');
    isFlipped = false;
  }
}

function flipCard() {
  document.getElementById('card').classList.toggle('flipped');
  isFlipped = !isFlipped;
}

function nextCard() {
  if (currentIndex < cards.length - 1) {
    currentIndex++;
    updateCard();
  }
}

function prevCard() {
  if (currentIndex > 0) {
    currentIndex--;
    updateCard();
  }
}

function markCorrect() {
  if (cards.length === 0) return;
  const c = cards[currentIndex];
  correct.add(c.id);
  incorrect.delete(c.id);
  if (currentIndex < cards.length - 1) nextCard();
  else updateCard();
  checkComplete();
}

function markIncorrect() {
  if (cards.length === 0) return;
  const c = cards[currentIndex];
  incorrect.add(c.id);
  correct.delete(c.id);
  if (currentIndex < cards.length - 1) nextCard();
  else updateCard();
  checkComplete();
}

function checkComplete() {
  if (correct.size + incorrect.size === cards.length) {
    showSummary();
  }
}

function showSummary() {
  const pct = Math.round((correct.size / allCards.length) * 100);
  document.getElementById('finalScore').textContent = `${pct}%`;
  document.getElementById('finalScore').className =
    `score ${pct >= 80 ? 'good' : pct >= 60 ? 'ok' : 'bad'}`;
  document.getElementById('finalMsg').textContent =
    pct >= 80 ? 'Excelente! Estas listo para el examen.' :
    pct >= 60 ? 'Vas bien, repasa las incorrectas.' :
    'Necesitas estudiar mas. Repasa todas las tarjetas.';
  document.getElementById('summary').style.display = 'block';
}

function shuffleCards() {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  currentIndex = 0;
  updateCard();
}

function resetAll() {
  correct.clear();
  incorrect.clear();
  cards = filterCards();
  currentIndex = 0;
  document.getElementById('summary').style.display = 'none';
  updateCard();
}

function filterCards() {
  if (currentFilter === 'all') return [...allCards];
  return allCards.filter(c => c.tag === currentFilter);
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  cards = filterCards();
  currentIndex = 0;
  document.getElementById('summary').style.display = 'none';
  updateCard();
}

function showOnlyWrong() {
  if (incorrect.size === 0) return;
  cards = allCards.filter(c => incorrect.has(c.id));
  currentIndex = 0;
  document.getElementById('summary').style.display = 'none';
  updateCard();
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  if (e.code === 'ArrowRight') nextCard();
  if (e.code === 'ArrowLeft') prevCard();
  if (e.code === 'KeyC') markCorrect();
  if (e.code === 'KeyX') markIncorrect();
});

updateCard();
</script>
